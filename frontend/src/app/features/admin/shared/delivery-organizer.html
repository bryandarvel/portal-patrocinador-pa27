<nz-modal
  [nzVisible]="open()"
  (nzOnCancel)="open.set(false)"
  [nzTitle]="stage() === 'saved' ? 'Alterações salvas' : 'Organizar entrega'"
  [nzFooter]="null"
  [nzCentered]="true"
  nzClassName="pa-profile-dialog"
  ><ng-container *nzModalContent
    ><div class="dialog-content">
      @if (stage() === 'choose') {
        <p>{{ preview.delivery()?.titulo }} · Defina a pessoa responsável.</p>
        <label for="owner-select">Responsável pela entrega</label
        ><select
          id="owner-select"
          [value]="selected()"
          (change)="selected.set(ownerSelect.value)"
          #ownerSelect
        >
          <option value="">Selecione</option>
          @for (owner of owners(); track owner.id) {
            <option [value]="owner.id">{{ owner.nome }} · {{ owner.email }}</option>
          }
        </select>
        @if (!owners().length) {
          <p>Nenhum responsável RBS ativo disponível.</p>
        }
        <button
          nz-button
          class="pill dark-button"
          type="button"
          [disabled]="!selected() || api.pending() > 0"
          (click)="save()"
        >
          Salvar responsável</button
        ><button nz-button class="pill" type="button" (click)="open.set(false)">Cancelar</button>
      } @else {
        <p role="status">O responsável foi atualizado na parceria.</p>
        <button nz-button class="pill dark-button" type="button" (click)="open.set(false)">
          Concluir
        </button>
      }
    </div></ng-container
  ></nz-modal
>
