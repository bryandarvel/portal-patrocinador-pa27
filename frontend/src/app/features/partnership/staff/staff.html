<app-partnership-shell
  activeArea="05"
  title="Credenciamento"
  description="Quantidades e orientações para o credenciamento da equipe."
>
  <div class="staff-panels sponsor-staff">
    <section class="pa-card staff-card" aria-labelledby="staff-credentials-title">
      <app-card-heading
        icon="idcard"
        heading="Credenciais previstas"
        headingId="staff-credentials-title"
      />
      <app-credential-list [credentials]="accreditation()?.itens ?? []" />
    </section>
    <section class="pa-card staff-card external-guidance" aria-labelledby="staff-external-title">
      <app-card-heading
        icon="link"
        tone="pink"
        heading="Credenciamento externo"
        headingId="staff-external-title"
      />
      <p>O credenciamento acontece no Open Staff.</p>
      @if (preview.validUrl(accreditation()?.urlOpenStaff)) {
        <a
          nz-button
          class="pill primary-button open-staff-button"
          [href]="accreditation()!.urlOpenStaff"
          target="_blank"
          rel="noopener noreferrer"
          aria-describedby="open-staff-new-tab"
          ><nz-icon nzType="export" aria-hidden="true" />Acessar Open Staff</a
        >
        <p id="open-staff-new-tab" class="external-link-note">Abre em nova aba.</p>
      } @else {
        <p>O endereço do Open Staff ainda não foi configurado pela RBS.</p>
      }
    </section>
  </div>
</app-partnership-shell>
