<app-partnership-shell
  activeArea="01"
  title="Perfil do cliente"
  description="Informações que identificam a parceria e seus documentos comerciais."
  pageUrl="/perfil"
>
  <div class="profile-panels">
    <section class="pa-card profile-card partnership-data" aria-labelledby="partnership-data-title">
      <app-card-heading
        icon="user"
        heading="Dados da parceria"
        headingId="partnership-data-title"
      />
      <div class="profile-field">
        <label for="sponsor-name">Nome do patrocinador</label
        ><input nz-input id="sponsor-name" [value]="partnership().sponsorName" readonly />
      </div>
      <div class="profile-field">
        <label for="sponsor-quota">Cota / plano comercial</label
        ><input nz-input id="sponsor-quota" [value]="partnership().quota" readonly />
      </div>
      <div class="profile-field">
        <label for="sponsor-email">E-mail da conta</label
        ><input nz-input id="sponsor-email" type="email" [value]="partnership().email" readonly />
      </div>
    </section>
    <section
      class="pa-card profile-card commercial-documents"
      aria-labelledby="commercial-documents-title"
    >
      <app-card-heading
        icon="file-text"
        tone="pink"
        heading="Documentos comerciais"
        headingId="commercial-documents-title"
      />
      <p>Arquivos disponibilizados pela RBS para esta parceria.</p>
      @for (document of partnership().documents; track document.id) {
        <button
          class="document-card"
          type="button"
          [disabled]="api.pending() > 0"
          (click)="download(document.id, document.title)"
          [attr.aria-label]="'Baixar ' + document.title"
        >
          <span class="document-icon" aria-hidden="true"><nz-icon nzType="file-text" /></span
          ><span class="document-description"
            ><strong>{{ document.title }}</strong
            ><span>{{ document.description }}</span></span
          ><span class="document-action">Baixar <nz-icon nzType="right" aria-hidden="true" /></span>
        </button>
      } @empty {
        <app-empty-state
          heading="Nenhum documento disponível"
          description="Os documentos comerciais publicados pela RBS aparecerão aqui."
        />
      }
    </section>
  </div>
</app-partnership-shell>
