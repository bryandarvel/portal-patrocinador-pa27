spring.application.name=portal-patrocinador
# Configurações de E-mail (Exemplo com Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-app-aqui
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL do seu frontend para o link de confirmação
api.verificacao.url=http://localhost:4200/verificar?token=

# Banco de Dados H2 (apenas para testes iniciais)
spring.datasource.url=jdbc:h2:mem:portaldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect