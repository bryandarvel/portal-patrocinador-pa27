spring.application.name=portal-patrocinador
spring.datasource.url=${PORTAL_DATABASE_URL:jdbc:postgresql://localhost:5432/portal}
spring.datasource.username=${PORTAL_DATABASE_USER:portal}
spring.datasource.password=${PORTAL_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${PORTAL_BASELINE_ON_MIGRATE:false}
spring.jpa.open-in-view=false
spring.flyway.baseline-version=0

portal.jwt.secret=${PORTAL_JWT_SECRET:}
portal.jwt.access-ttl=${PORTAL_JWT_ACCESS_TTL:PT8H}
portal.jwt.challenge-ttl=${PORTAL_JWT_CHALLENGE_TTL:PT5M}
portal.verification-ttl=${PORTAL_VERIFICATION_TTL:PT24H}
portal.bootstrap.enabled=${PORTAL_BOOTSTRAP_ENABLED:false}
portal.bootstrap.name=${PORTAL_BOOTSTRAP_NAME:}
portal.bootstrap.email=${PORTAL_BOOTSTRAP_EMAIL:}
portal.bootstrap.password=${PORTAL_BOOTSTRAP_PASSWORD:}
portal.mail.enabled=${PORTAL_MAIL_ENABLED:false}
portal.frontend-url=${PORTAL_FRONTEND_URL:http://localhost:4200}
spring.mail.host=${PORTAL_SMTP_HOST:localhost}
spring.mail.port=${PORTAL_SMTP_PORT:1025}
spring.mail.username=${PORTAL_SMTP_USERNAME:}
spring.mail.password=${PORTAL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${PORTAL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${PORTAL_SMTP_STARTTLS:false}
portal.storage.directory=${PORTAL_STORAGE_DIRECTORY:/data/arquivos}
portal.storage.max-bytes=${PORTAL_UPLOAD_MAX_BYTES:20971520}
spring.servlet.multipart.max-file-size=${PORTAL_UPLOAD_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${PORTAL_UPLOAD_MAX_REQUEST_SIZE:22MB}
