name: desafio-gc-rbs-local

services:
  mailpit:
    image: axllent/mailpit:v1.30.3
    ports:
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    command: ["sh", "./mvnw", "spring-boot:run"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/portal
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: portal
      SPRING_DATASOURCE_PASSWORD: portal-local
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?Configure PORTAL_JWT_SECRET no arquivo .env}
      PORTAL_BASELINE_ON_MIGRATE: "true"
      PORTAL_BOOTSTRAP_ENABLED: ${PORTAL_BOOTSTRAP_ENABLED:-false}
      PORTAL_BOOTSTRAP_NAME: ${PORTAL_BOOTSTRAP_NAME:-}
      PORTAL_BOOTSTRAP_EMAIL: ${PORTAL_BOOTSTRAP_EMAIL:-}
      PORTAL_BOOTSTRAP_PASSWORD: ${PORTAL_BOOTSTRAP_PASSWORD:-}
      PORTAL_MAIL_ENABLED: "true"
      PORTAL_SMTP_HOST: mailpit
      PORTAL_SMTP_PORT: "1025"
      PORTAL_FRONTEND_URL: http://localhost:4200
      PORTAL_STORAGE_DIRECTORY: /data/arquivos
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
      - portal-files:/data/arquivos
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: node:24.15.0-bookworm-slim
    working_dir: /workspace
    command: ["sh", "-c", "npm ci && npm start -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      API_PROXY_TARGET: http://backend:8080
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
      - npm-cache:/root/.npm
    depends_on:
      - backend

volumes:
  portal-files:
  postgres-data:
  maven-cache:
  frontend-node-modules:
  npm-cache:
